<!doctype html>
<html lang="en">
  <head>
    <!-- db results page setup -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Live scores and completed results from the Tagalog Open."
    >

    <title>Scores & Results | Tagalog Open</title>

    <link rel="icon" href="favicon.png?v=2" type="image/png">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

    <!-- db shared site styling -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- db shared site logic -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-page="results">

    <!-- db shared header here -->
    <div data-site-header></div>

    <!-- db main page content starts here -->
    <main id="main">

      <!-- db hero / intro section -->
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">Courtside</div>
          <h1 class="display">Scores &<br>Results</h1>
          <p class="lead">
            Follow live action and review every completed match from first serve
            to final point.
          </p>
        </div>
      </section>

      <!-- db live and completed results -->
      <section class="section section-soft">
        <div class="container">

          <!-- db tab buttons -->
          <div class="tabs" role="tablist">
            <button
              class="tab active"
              type="button"
              role="tab"
              aria-selected="true"
              data-tab="panel-live"
            >
              Live matches
            </button>
            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-tab="panel-completed"
            >
              Completed results
            </button>
          </div>

          <!-- db javascript fills each panel -->
          <section class="tab-panel" id="panel-live" role="tabpanel">
            <div class="result-grid" id="live-results"></div>
          </section>

          <section
            class="tab-panel"
            id="panel-completed"
            role="tabpanel"
            hidden
          >
            <div class="toolbar" style="margin-bottom: 1rem">
              <label class="field" style="max-width: 420px">
                <span class="eyebrow" style="position: absolute; left: -9999px">
                  Search completed results
                </span>
                <input
                  id="results-search"
                  type="search"
                  placeholder="Search by player, round, court, or winner..."
                >
              </label>
            </div>
            <div class="result-grid" id="completed-results"></div>
          </section>
        </div>
      </section>
    </main>

    <!-- db shared footer gets injected here -->
    <div data-site-footer></div>

    <!-- db reusable modal for match details -->
    <div
      class="modal"
      id="detail-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Match details"
      hidden
    >
      <div class="modal-panel"></div>
    </div>
  </body>
</html>
