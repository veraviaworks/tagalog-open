<!doctype html>
<html lang="en">
  <head>
    <!-- db rules page setup -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Official rules and competition policies for the Tagalog Open."
    >

    <title>Rules | Tagalog Open</title>

    <link rel="icon" href="favicon.png?v=2" type="image/png">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

    <!-- db shared site styling -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- db shared site logic -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-page="rules">

    <!-- db shared header here -->
    <div data-site-header></div>

    <!-- db main page content starts here -->
    <main id="main">

      <!-- db hero / intro section -->
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">Official competition policy</div>
          <h1 class="display">Tournament<br>Rules</h1>
          <p class="lead">
            Clear standards for fair play, competitive integrity, and a
            first-class tournament experience.
          </p>
        </div>
      </section>

      <!-- db rules section -->
      <section class="section section-soft">
        <div class="container">

          <!-- db static summary row -->
          <div class="rules-meta">
            <span>
              <strong>Tagalog Open Official Rules</strong><br>
              <span class="muted">Approved by the tournament committee</span>
            </span>
            <span>
              Last updated: <strong id="rules-updated"></strong>
            </span>
          </div>

          <!-- db javascript builds expandable section here -->
          <div class="rules-list" id="rules-list"></div>
        </div>
      </section>
    </main>

    <!-- db shared footer here -->
    <div data-site-footer></div>

    <!-- db shared modal shell for easter eggs and details -->
    <div id="detail-modal" class="modal" hidden>
      <div class="modal-panel"></div>
    </div>
  </body>
</html>
