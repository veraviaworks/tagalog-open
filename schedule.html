<!doctype html>
<html lang="en">
  <head>
    <!-- db schedule page setup -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Full Tagalog Open match schedule and court assignments."
    >

    <title>Schedule | Tagalog Open</title>

    <!-- db shared site styling -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- db shared site logic -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-page="schedule">

    <!-- db shared header here -->
    <div data-site-header></div>

    <!-- db main page content starts here -->
    <main id="main">

      <!-- db hero / intro section -->
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">Order of play</div>
          <h1 class="display">Schedule</h1>
          <p class="lead">
            Every match on the road to the Los Santos championship.
          </p>
        </div>
      </section>

      <!-- db schedule tools and results -->
      <section class="section section-soft">
        <div class="container">

          <!-- db filter controls -->
          <div class="toolbar">
            <label class="field">
              <span class="eyebrow" style="position: absolute; left: -9999px">
                Search player
              </span>
              <input id="filter-search" type="search" placeholder="Search player...">
            </label>

            <label class="field">
              <span class="eyebrow" style="position: absolute; left: -9999px">
                Round
              </span>
              <select id="filter-round"></select>
            </label>

            <label class="field">
              <span class="eyebrow" style="position: absolute; left: -9999px">
                Status
              </span>
              <select id="filter-status"></select>
            </label>

            <label class="field">
              <span class="eyebrow" style="position: absolute; left: -9999px">
                Court
              </span>
              <select id="filter-court"></select>
            </label>
          </div>

          <!-- db desktop / tablet table -->
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Court</th>
                  <th>Round</th>
                  <th>Match</th>
                  <th>Score</th>
                  <th>Winner</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="schedule-body"></tbody>
            </table>
          </div>

          <!-- db mobile-friendly cards below -->
          <div class="mobile-match-list" id="schedule-mobile"></div>

          <!-- db empty state shown when filters return no matches -->
          <div class="empty-state" id="schedule-empty" hidden>
            <strong>No matches found</strong>
            Try changing your filters or player search.
          </div>
        </div>
      </section>
    </main>

    <!-- db shared footer here -->
    <div data-site-footer></div>
  </body>
</html>
