<!doctype html>
<html lang="en">
  <head>
    <!-- db players page setup -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Meet the registered players competing in the Tagalog Open."
    >

    <title>Players | Tagalog Open</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- db shared site styling -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- db shared site logic -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-page="players">

    <!-- db shared header here -->
    <div data-site-header></div>

    <!-- db main page content starts here -->

    <main id="main">

      <!-- db hero / intro section here-->
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">The field</div>
          <h1 class="display">Players</h1>
          <p class="lead">
            Meet the competitors stepping onto the court for Los Santos' city
            championship.
          </p>
        </div>
      </section>

      <!-- db player directory -->
      <section class="section section-soft">
        <div class="container">
          <div class="section-heading">
            <div>
              <div class="eyebrow" style="color: var(--green-2)">
                Registered competitors
              </div>
              <h2 class="section-title">Tournament field</h2>
            </div>

            <!-- db javaScript updates this count -->
            <span id="player-count" class="muted"></span>
          </div>

          <!-- db search tools -->
          <div class="toolbar">
            <label class="field">
              <span class="eyebrow" style="position: absolute; left: -9999px">
                Search players
              </span>
              <input
                id="player-search"
                type="search"
                placeholder="Search by player or organization..."
                autocomplete="off"
              >
            </label>
          </div>

          <!-- db javaScript display player cards here -->
          <div class="players-grid" id="players-grid"></div>
        </div>
      </section>
    </main>

    <!-- db shared footer here -->
    <div data-site-footer></div>

    <!-- db reusable modal for player details -->
    <div
      class="modal"
      id="detail-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Player details"
      hidden
    >
      <div class="modal-panel"></div>
    </div>
  </body>
</html>
